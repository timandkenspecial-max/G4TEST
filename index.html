<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>騰元國小 - 全功能互動測驗系統</title>
<style>
  :root {
    --primary: #3182ce;
    --primary-light: #ebf8ff;
    --success: #2f855a;
    --success-bg: #f0fff4;
    --danger: #c53030;
    --danger-bg: #fff5f5;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #2d3748;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: linear-gradient(180deg, #ebf8ff 0%, #f7fafc 100%);
    color: var(--text);
    margin: 0;
    padding: 16px;
    line-height: 1.6;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    padding: 24px;
    border: 3px solid #cbd5e0;
  }
  .header {
    text-align: center;
    border-bottom: 3px double var(--primary);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .header h1 {
    margin: 0 0 6px 0;
    color: #1a365d;
    font-size: 30px;
    letter-spacing: 1px;
  }
  .header .subtitle {
    color: #4a5568;
    font-size: 16px;
    font-weight: 600;
  }
  .controls-panel {
    background: var(--primary-light);
    border: 2px solid #bee3f8;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .control-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 260px;
  }
  .control-group label {
    font-weight: bold;
    color: #2b6cb0;
    white-space: nowrap;
  }
  .control-group select {
    flex: 1;
    font-size: 16px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid #3182ce;
    background: white;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--primary);
    color: white;
    border: none;
    font-size: 16px;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(49,130,206,0.3);
    width: 100%;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-submit {
    background: #38a169;
    color: white;
    border: none;
    width: 100%;
    font-size: 20px;
    padding: 16px;
    margin-top: 24px;
    border-radius: 14px;
    font-weight: bold;
    box-shadow: 0 4px 14px rgba(56,161,105,0.35);
    cursor: pointer;
  }
  .score-banner {
    display: none;
    text-align: center;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #f0fff4 0%, #e6fffa 100%);
    border: 3px solid #38a169;
  }
  .score-banner h2 {
    margin: 0;
    font-size: 32px;
    color: #22543d;
  }
  .score-banner p {
    margin: 8px 0 0 0;
    font-size: 18px;
    color: #2f855a;
    font-weight: bold;
  }
  .section-title {
    background: var(--primary);
    color: white;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 19px;
    font-weight: bold;
    margin: 28px 0 16px 0;
  }
  .q-card {
    background: #fff;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    transition: all 0.2s;
  }
  .q-card.correct {
    border-color: var(--success);
    background: var(--success-bg);
  }
  .q-card.wrong {
    border-color: var(--danger);
    background: var(--danger-bg);
  }
  .q-text {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #1a202c;
  }
  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 10px;
  }
  .opt-btn {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    background: #f8fafc;
    border: 2px solid #cbd5e0;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
  }
  .opt-btn:hover { background: #edf2f7; }
  .opt-btn.selected {
    border-color: var(--primary);
    background: var(--primary-light);
    font-weight: bold;
    color: var(--primary);
  }
  .opt-btn.ans-correct {
    border-color: var(--success) !important;
    background: #c6f6d5 !important;
    color: #22543d !important;
    font-weight: bold;
  }
  .opt-btn.ans-wrong {
    border-color: var(--danger) !important;
    background: #fed7d7 !important;
    color: #742a2a !important;
  }
  .feedback {
    display: none;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #cbd5e0;
    font-size: 16px;
    font-weight: bold;
  }
  .pre-loaded-notice {
    background: #fffaf0;
    border: 1px dashed #dd6b20;
    color: #c05621;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    text-align: center;
    margin-bottom: 15px;
  }
</style>
</head>

    <div class="subtitle">國小一貫化智慧評量平台（支援平板觸控與自動批改）</div>
  </div>

  <div class="pre-loaded-notice">

  </div>

          <option value="MID">上學期期中考範圍</option>
          <option value="FULL">上學期全年範圍（總複習）</option>
        </select>
      </div>
    </div>
    <button class="btn-primary" onclick="generateNewExam()">🔄 確認設定並重新隨機出題</button>
  </div>

  <div id="scoreBanner" class="score-banner">
    <h2 id="scoreTitle">得分：100 分</h2>
    <p id="scoreDetail"></p>
  </div>

  <div id="examContent"></div>

  <button id="submitBtn" class="btn-submit" onclick="gradeExam()">✅ 交卷並自動批改計分</button>
</div>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateSubjOptions() {
  // 依據年級切換提示或範圍設定
  const grade = document.getElementById('gradeSelect').value;
  const scope = document.getElementById('scopeSelect');
  if (grade === 'G2') {
    scope.options[0].text = "上學期期中考範圍（國、數、生活基礎）";
    scope.options[1].text = "上學期全年總複習（國、數、生活綜合）";
  } else {
    scope.options[0].text = "上學期期中考範圍（前三單元核心）";
    scope.options[1].text = "上學期全年總複習（六科全範圍）";
  }
}

function generateNewExam() {
  isGraded = false;
  userAnswers = {};
  document.getElementById('scoreBanner').style.display = 'none';
  document.getElementById('submitBtn').style.display = 'block';

  const grade = document.getElementById('gradeSelect').value;
  const scope = document.getElementById('scopeSelect').value;
  const targetBank = (grade === 'G4') ? bankG4 : bankG2;
  
  currentExam = [];

  // 根據期中或全年範圍決定抽題策略
  if (grade === 'G4') {
    const sections = [
      { title: "一、國語文測驗", key: "國語", count: (scope === 'MID' ? 3 : 5) },
      { title: "二、數學觀念測驗", key: "數學觀念", count: (scope === 'MID' ? 2 : 4) },
      { title: "三、數學計算與應用", key: "數學計算與應用", count: (scope === 'MID' ? 2 : 4) },
      { title: "四、社會科測驗", key: "社會", count: (scope === 'MID' ? 2 : 4) },
      { title: "五、自然科學測驗", key: "自然", count: (scope === 'MID' ? 2 : 4) },
      { title: "六、英語科測驗", key: "英語", count: (scope === 'MID' ? 2 : 4) }
    ];
    sections.forEach(sec => {
      const sourceList = targetBank[sec.key] || [];
      if (sourceList.length === 0) return;
      const picked = shuffle(sourceList).slice(0, Math.min(sec.count, sourceList.length)).map(q => {
        const opts = shuffle([q.a, ...q.distractors.slice(0, 3)]);
        return { ...q, opts };
      });
      if (picked.length > 0) {
        currentExam.push({ title: sec.title, questions: picked });
      }
    });
  } else {
    // 二年級區段
    const sections = [
      { title: "一、國語文大挑戰", key: "國語", count: (scope === 'MID' ? 3 : 5) },
      { title: "二、數學觀念大挑戰", key: "數學觀念", count: (scope === 'MID' ? 2 : 4) },
      { title: "三、數學計算與應用", key: "數學計算與應用", count: (scope === 'MID' ? 2 : 4) },
      { title: "四、生活課程探索", key: "生活", count: (scope === 'MID' ? 2 : 4) }
    ];
    sections.forEach(sec => {
      const sourceList = targetBank[sec.key] || [];
      if (sourceList.length === 0) return;
      const picked = shuffle(sourceList).slice(0, Math.min(sec.count, sourceList.length)).map(q => {
        const opts = shuffle([q.a, ...q.distractors.slice(0, 3)]);
        return { ...q, opts };
      });
      if (picked.length > 0) {
        currentExam.push({ title: sec.title, questions: picked });
      }
    });
  }

  renderExam();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderExam() {
  const container = document.getElementById('examContent');
  container.innerHTML = '';
  let globalIdx = 1;

  if (currentExam.length === 0) {
    container.innerHTML = '<p style="text-align:center; color:red;">目前該範圍題目載入中，請點擊上方重新抽題！</p>';
    return;
  }

  currentExam.forEach(sec => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section-title';
    secDiv.textContent = sec.title;
    container.appendChild(secDiv);

    sec.questions.forEach(q => {
      const qId = globalIdx++;
      const card = document.createElement('div');
      card.className = 'q-card';
      card.id = `q-card-${qId}`;

      const qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = `${qId}. ${q.q}`;
      card.appendChild(qText);

      const grid = document.createElement('div');
      grid.className = 'options-grid';

      q.opts.forEach((optText, oIdx) => {
        const btn = document.createElement('div');
        btn.className = 'opt-btn';
        btn.id = `opt-${qId}-${oIdx}`;
        btn.textContent = `(${oIdx + 1}) ${optText}`;
        btn.onclick = () => selectOption(qId, oIdx, optText);
        grid.appendChild(btn);
      });

      card.appendChild(grid);

      const fb = document.createElement('div');
      fb.className = 'feedback';
      fb.id = `fb-${qId}`;
      card.appendChild(fb);

      container.appendChild(card);
      q._qId = qId;
    });
  });
}

function selectOption(qId, oIdx, optText) {
  if (isGraded) return;
  userAnswers[qId] = { oIdx, optText };
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`opt-${qId}-${i}`);
    if (el) el.classList.toggle('selected', i === oIdx);
  }
}

function gradeExam() {
  let totalQ = 0;
  let correctCount = 0;
  let unanswered = 0;

  currentExam.forEach(sec => {
    sec.questions.forEach(q => {
      totalQ++;
      if (!userAnswers[q._qId]) unanswered++;
    });
  });

  if (unanswered > 0) {
    if (!confirm(`還有 ${unanswered} 題尚未作答，確定要直接交卷批改嗎？`)) return;
  }

  isGraded = true;
  document.getElementById('submitBtn').style.display = 'none';

  currentExam.forEach(sec => {
    sec.questions.forEach(q => {
      const qId = q._qId;
      const card = document.getElementById(`q-card-${qId}`);
      const fb = document.getElementById(`fb-${qId}`);
      const uAns = userAnswers[qId];

      const isCorrect = uAns && uAns.optText === q.a;
      if (isCorrect) correctCount++;

      card.classList.add(isCorrect ? 'correct' : 'wrong');
      fb.style.display = 'block';
      fb.style.color = isCorrect ? '#2f855a' : '#c53030';
      fb.textContent = isCorrect 
        ? '⭕ 答對了！太棒了！' 
        : `❌ 答錯了！標準答案為：${q.a}`;

      q.opts.forEach((optText, oIdx) => {
        const btn = document.getElementById(`opt-${qId}-${oIdx}`);
        if (optText === q.a) btn.classList.add('ans-correct');
        else if (uAns && uAns.oIdx === oIdx) btn.classList.add('ans-wrong');
      });
    });
  });

  const score = Math.round((correctCount / totalQ) * 100);
  const banner = document.getElementById('scoreBanner');
  banner.style.display = 'block';
  document.getElementById('scoreTitle').textContent = `🎉 測驗總分：${score} 分`;
  document.getElementById('scoreDetail').textContent = `共 ${totalQ} 題，答對 ${correctCount} 題，答錯 ${totalQ - correctCount} 題（往下滑動可檢視錯題訂正）`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 頁面載入時預設生成四年級期中考卷
window.onload = function() {
  updateSubjOptions();
  generateNewExam();
};
</script>
