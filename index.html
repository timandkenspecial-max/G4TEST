<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>騰元國小考卷 - 四年級上學期平板互動測驗系統</title>
<style>
  :root {
    --primary: #2b6cb0;
    --primary-light: #ebf8ff;
    --success: #2f855a;
    --success-bg: #f0fff4;
    --danger: #c53030;
    --danger-bg: #fff5f5;
    --bg: #f7fafc;
    --card: #ffffff;
    --text: #2d3748;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px;
    line-height: 1.6;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 24px;
  }
  .header {
    text-align: center;
    border-bottom: 3px double var(--primary);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .header h1 {
    margin: 0 0 8px 0;
    color: #1a365d;
    font-size: 28px;
    letter-spacing: 1px;
  }
  .header .subtitle {
    color: #4a5568;
    font-size: 16px;
    font-weight: 600;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
    background: var(--primary-light);
    padding: 14px 18px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .controls select, .controls button {
    font-size: 16px;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid #cbd5e0;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--primary);
    color: white;
    border: none !important;
    box-shadow: 0 2px 6px rgba(43,108,176,0.3);
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-submit {
    background: #d69e2e;
    color: white;
    border: none !important;
    width: 100%;
    font-size: 20px !important;
    padding: 16px !important;
    margin-top: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(214,158,46,0.35);
  }
  .score-banner {
    display: none;
    text-align: center;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #ebf8ff 0%, #e6fffa 100%);
    border: 2px solid #319795;
  }
  .score-banner h2 {
    margin: 0;
    font-size: 32px;
    color: #234e52;
  }
  .score-banner p {
    margin: 8px 0 0 0;
    font-size: 18px;
    color: #2c7a7b;
  }
  .section-title {
    background: #2b6cb0;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 19px;
    font-weight: bold;
    margin: 28px 0 16px 0;
  }
  .q-card {
    background: #fff;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    transition: all 0.2s;
  }
  .q-card.correct {
    border-color: var(--success);
    background: var(--success-bg);
  }
  .q-card.wrong {
    border-color: var(--danger);
    background: var(--danger-bg);
  }
  .q-text {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #1a202c;
  }
  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 10px;
  }
  .opt-btn {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    background: #f8fafc;
    border: 2px solid #cbd5e0;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
  }
  .opt-btn:hover { background: #edf2f7; }
  .opt-btn.selected {
    border-color: var(--primary);
    background: var(--primary-light);
    font-weight: bold;
    color: var(--primary);
  }
  .opt-btn.ans-correct {
    border-color: var(--success) !important;
    background: #c6f6d5 !important;
    color: #22543d !important;
    font-weight: bold;
  }
  .opt-btn.ans-wrong {
    border-color: var(--danger) !important;
    background: #fed7d7 !important;
    color: #742a2a !important;
  }
  .feedback {
    display: none;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #cbd5e0;
    font-size: 16px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏫 騰元國小考卷</h1>
    <div class="subtitle">四年級上學期 綜合實力平板互動測驗系統（內建 500+ 題庫）</div>
  </div>

  <div class="controls">
    <div>
      <label for="subjSelect"><strong>測驗範圍：</strong></label>
      <select id="subjSelect" onchange="generateNewExam()">
        <option value="ALL">綜合全科考卷（共 25 題，每題 4 分）</option>
        <option value="國語">單科特訓：國語文（20 題）</option>
        <option value="數學觀念">單科特訓：數學觀念（20 題）</option>
        <option value="數學計算與應用">單科特訓：數學計算與應用（20 題）</option>
        <option value="社會">單科特訓：社會科（20 題）</option>
        <option value="自然">單科特訓：自然科學（20 題）</option>
        <option value="英語">單科特訓：英語科（20 題）</option>
      </select>
    </div>
    <button class="btn-primary" onclick="generateNewExam()">🔄 重新隨機出題</button>
  </div>

  <div id="scoreBanner" class="score-banner">
    <h2 id="scoreTitle">得分：100 分</h2>
    <p id="scoreDetail"></p>
  </div>

  <div id="examContent"></div>

  <button id="submitBtn" class="btn-submit" onclick="gradeExam()">✅ 交卷並自動批改計分</button>
</div>

let currentExam = [];
let userAnswers = {};
let isGraded = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateNewExam() {
  isGraded = false;
  userAnswers = {};
  document.getElementById('scoreBanner').style.display = 'none';
  document.getElementById('submitBtn').style.display = 'block';

  const mode = document.getElementById('subjSelect').value;
  currentExam = [];

  if (mode === 'ALL') {
    const plan = [
      { title: "一、國語文測驗", key: "國語", count: 5 },
      { title: "二、數學觀念測驗", key: "數學觀念", count: 4 },
      { title: "三、數學計算與應用", key: "數學計算與應用", count: 4 },
      { title: "四、社會科測驗", key: "社會", count: 4 },
      { title: "五、自然科學測驗", key: "自然", count: 4 },
      { title: "六、英語科測驗", key: "英語", count: 4 }
    ];
    plan.forEach(sec => {
      const picked = shuffle(questionBank[sec.key]).slice(0, sec.count).map(q => {
        const opts = shuffle([q.a, ...q.distractors.slice(0, 3)]);
        return { ...q, opts };
      });
      currentExam.push({ title: sec.title, questions: picked });
    });
  } else {
    const picked = shuffle(questionBank[mode]).slice(0, 20).map(q => {
      const opts = shuffle([q.a, ...q.distractors.slice(0, 3)]);
      return { ...q, opts };
    });
    currentExam.push({ title: `【${mode}】專項測驗（每題 5 分）`, questions: picked });
  }

  renderExam();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderExam() {
  const container = document.getElementById('examContent');
  container.innerHTML = '';
  let globalIdx = 1;

  currentExam.forEach(sec => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section-title';
    secDiv.textContent = sec.title;
    container.appendChild(secDiv);

    sec.questions.forEach(q => {
      const qId = globalIdx++;
      const card = document.createElement('div');
      card.className = 'q-card';
      card.id = `q-card-${qId}`;

      const qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = `${qId}. ${q.q}`;
      card.appendChild(qText);

      const grid = document.createElement('div');
      grid.className = 'options-grid';

      q.opts.forEach((optText, oIdx) => {
        const btn = document.createElement('div');
        btn.className = 'opt-btn';
        btn.id = `opt-${qId}-${oIdx}`;
        btn.textContent = `(${oIdx + 1}) ${optText}`;
        btn.onclick = () => selectOption(qId, oIdx, optText);
        grid.appendChild(btn);
      });

      card.appendChild(grid);

      const fb = document.createElement('div');
      fb.className = 'feedback';
      fb.id = `fb-${qId}`;
      card.appendChild(fb);

      container.appendChild(card);
      q._qId = qId;
    });
  });
}

function selectOption(qId, oIdx, optText) {
  if (isGraded) return;
  userAnswers[qId] = { oIdx, optText };
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`opt-${qId}-${i}`);
    if (el) el.classList.toggle('selected', i === oIdx);
  }
}

function gradeExam() {
  let totalQ = 0;
  let correctCount = 0;
  let unanswered = 0;

  currentExam.forEach(sec => {
    sec.questions.forEach(q => {
      totalQ++;
      if (!userAnswers[q._qId]) unanswered++;
    });
  });

  if (unanswered > 0) {
    if (!confirm(`還有 ${unanswered} 題尚未作答，確定要直接交卷批改嗎？`)) return;
  }

  isGraded = true;
  document.getElementById('submitBtn').style.display = 'none';

  currentExam.forEach(sec => {
    sec.questions.forEach(q => {
      const qId = q._qId;
      const card = document.getElementById(`q-card-${qId}`);
      const fb = document.getElementById(`fb-${qId}`);
      const uAns = userAnswers[qId];

      const isCorrect = uAns && uAns.optText === q.a;
      if (isCorrect) correctCount++;

      card.classList.add(isCorrect ? 'correct' : 'wrong');
      fb.style.display = 'block';
      fb.style.color = isCorrect ? '#2f855a' : '#c53030';
      fb.textContent = isCorrect 
        ? '⭕ 答對了！太棒了！' 
        : `❌ 答錯了！標準答案為：${q.a}`;

      q.opts.forEach((optText, oIdx) => {
        const btn = document.getElementById(`opt-${qId}-${oIdx}`);
        if (optText === q.a) btn.classList.add('ans-correct');
        else if (uAns && uAns.oIdx === oIdx) btn.classList.add('ans-wrong');
      });
    });
  });

  const score = Math.round((correctCount / totalQ) * 100);
  const banner = document.getElementById('scoreBanner');
  banner.style.display = 'block';
  document.getElementById('scoreTitle').textContent = `🎉 測驗總分：${score} 分`;
  document.getElementById('scoreDetail').textContent = `共 ${totalQ} 題，答對 ${correctCount} 題，答錯 ${totalQ - correctCount} 題（往下滑動可檢視錯題訂正）`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = generateNewExam;
</script>
